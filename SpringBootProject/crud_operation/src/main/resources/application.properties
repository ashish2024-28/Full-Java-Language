spring.application.name=crud_operation

spring.datasource.url=jdbc:mysql://localhost:3306/democrud
spring.datasource.username=root
spring.datasource.password=radha

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ----------------MYSQL--------------------
# Property                      =>   Meaning
# spring.datasource.url	        =>  DBC URL of MySQL
# spring.datasource.username	=>  MySQL username
# spring.datasource.password	=>  MySQL password
# spring.jpa.hibernate.ddl-auto	=>  auto-create/update tables
# spring.jpa.show-sql	        =>  prints SQL in console
# hibernate.dialect	            =>  Optimizes SQL for MySQL

# ----------------MongoDB--------------------
# spring.data.mongodb.uri=mongodb://localhost:27017/your_database_name      or(Username + password)
# spring.data.mongodb.uri=mongodb://username:password@localhost:27017/your_database_name


#======== If using both DBs in same project ==================
# ✔ MySQL → JPA
# ✔ MongoDB → MongoRepository
