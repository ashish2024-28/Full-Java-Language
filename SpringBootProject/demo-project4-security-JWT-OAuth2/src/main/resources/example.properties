# ----------------MYSQL--------------------
# Property                      =>   Meaning
# spring.datasource.url	        =>  DBC URL of MySQL
# spring.datasource.username	=>  MySQL username
# spring.datasource.password	=>  MySQL password
# spring.jpa.hibernate.ddl-auto	=>  auto-create/update tables
# spring.jpa.show-sql	        =>  prints SQL in console
# hibernate.dialect	            =>  Optimizes SQL for MySQL

# ----------------MongoDB--------------------
# spring.data.mongodb.uri=mongodb://localhost:27017/your_database_name      or(Username + password)
# spring.data.mongodb.uri=mongodb://username:password@localhost:27017/your_database_name


